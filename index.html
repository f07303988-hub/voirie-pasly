<link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/leaflet/1.9.4/leaflet.min.css">
<style>
:root{--bg:#f3f5f8;--card:#fff;--ink:#1d2733;--muted:#6b7684;--line:#dfe4ea;--pri:#1f4e79;--pri2:#2b6cb0;--red:#d64545;--ora:#e08a1e;--grn:#2e9e5b}
*{box-sizing:border-box}
html,body{margin:0;height:100%}
body{font-family:system-ui,-apple-system,"Segoe UI",Roboto,sans-serif;background:var(--bg);color:var(--ink);display:flex;flex-direction:column;height:100dvh;-webkit-tap-highlight-color:transparent}
header{background:var(--pri);color:#fff;padding:calc(env(safe-area-inset-top) + 10px) 16px 10px;display:flex;align-items:center;gap:10px}
header h1{font-size:18px;margin:0;flex:1}
header .count{font-size:13px;opacity:.85}
.hbtn{background:rgba(255,255,255,.15);color:#fff;border:0;border-radius:8px;padding:7px 10px;font-size:14px}
.hbtn.on{background:#fff;color:var(--pri)}
#banner{display:none;background:#fff4e0;color:#7a4a00;padding:10px 16px;font-size:14px;border-bottom:1px solid #f1d6a8;align-items:center;gap:10px}
#banner.show{display:flex}
#banner span{flex:1}
#filters{display:none;background:var(--card);border-bottom:1px solid var(--line);padding:10px 16px;gap:8px;grid-template-columns:1fr 1fr}
#filters.show{display:grid}
#filters label{font-size:12px;color:var(--muted);display:flex;flex-direction:column;gap:3px}
#filters .reset{grid-column:1/-1;background:none;border:0;color:var(--pri2);font-size:14px;padding:4px;text-align:right}
select,input,textarea{font:inherit;font-size:16px;padding:9px 10px;border:1px solid var(--line);border-radius:8px;background:#fff;color:var(--ink);width:100%}
textarea{min-height:70px;resize:vertical}
main{flex:1;overflow:auto;position:relative}
.view{display:none;padding:12px 16px 100px}
.view.show{display:block}
#vMap{padding:0;height:100%}
#mainMap{height:100%;width:100%}
.card{background:var(--card);border-radius:12px;box-shadow:0 1px 3px rgba(0,0,0,.06);margin-bottom:10px;display:flex;overflow:hidden}
.card img{width:92px;height:92px;object-fit:cover;flex:none;background:#ddd}
.card .ct{padding:9px 12px;flex:1;min-width:0}
.card .t1{font-weight:600;font-size:15px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.card .t2{font-size:13px;color:var(--muted);margin-top:2px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.card .t3{display:flex;gap:6px;align-items:center;margin-top:6px;flex-wrap:wrap}
.badge{font-size:12px;font-weight:600;color:#fff;border-radius:20px;padding:2px 9px}
.chip{font-size:12px;color:var(--muted);background:var(--bg);border-radius:20px;padding:2px 8px}
.empty{text-align:center;color:var(--muted);padding:50px 20px;font-size:15px}
nav{display:flex;background:var(--card);border-top:1px solid var(--line);padding-bottom:env(safe-area-inset-bottom)}
nav button{flex:1;background:none;border:0;padding:10px 0 8px;font-size:13px;color:var(--muted);display:flex;flex-direction:column;align-items:center;gap:2px}
nav button svg{width:22px;height:22px}
nav button.on{color:var(--pri)}
#fab{position:fixed;right:18px;bottom:calc(env(safe-area-inset-bottom) + 72px);width:60px;height:60px;border-radius:50%;background:var(--ora);color:#fff;border:0;font-size:34px;line-height:1;box-shadow:0 4px 12px rgba(0,0,0,.25);z-index:500}
.panel{background:var(--card);border-radius:12px;padding:14px;margin-bottom:12px;box-shadow:0 1px 3px rgba(0,0,0,.06)}
.panel h2{font-size:16px;margin:0 0 6px}
.panel p{font-size:14px;color:var(--muted);margin:0 0 10px}
.btn{display:block;width:100%;border:0;border-radius:10px;padding:12px;font-size:16px;font-weight:600;background:var(--pri);color:#fff;margin-top:8px}
.btn.sec{background:var(--bg);color:var(--pri)}
.btn.danger{background:#fde8e8;color:var(--red)}
.stats{display:grid;grid-template-columns:repeat(3,1fr);gap:8px;margin-top:8px}
.stat{background:var(--bg);border-radius:10px;padding:8px;text-align:center}
.stat b{display:block;font-size:20px}
.stat small{font-size:12px;color:var(--muted)}
/* Formulaire */
#modal{position:fixed;inset:0;background:var(--bg);z-index:1000;display:none;flex-direction:column}
#modal.open{display:flex}
#modal .mh{background:var(--pri);color:#fff;padding:calc(env(safe-area-inset-top) + 10px) 16px 10px;display:flex;align-items:center;gap:10px}
#modal .mh h2{font-size:17px;margin:0;flex:1}
#modal .mb{flex:1;overflow:auto;padding:12px 16px calc(env(safe-area-inset-bottom) + 30px)}
.fg{margin-bottom:14px}
.fg>label,.fl{display:block;font-size:13px;font-weight:600;color:var(--muted);margin-bottom:5px}
#photoBox{background:#e6eaef;border-radius:12px;min-height:150px;display:flex;align-items:center;justify-content:center;overflow:hidden;position:relative}
#photoBox img{width:100%;max-height:300px;object-fit:contain;display:block;background:#000}
#photoBox .ph{color:var(--muted);font-size:15px;text-align:center;padding:20px}
#photoIn{display:none}
#fMap{height:230px;border-radius:12px;overflow:hidden;border:1px solid var(--line)}
.posline{display:flex;align-items:center;gap:8px;margin-top:6px;font-size:13px;color:var(--muted)}
.posline span{flex:1}
.mini{background:var(--card);border:1px solid var(--line);border-radius:8px;padding:6px 10px;font-size:13px;color:var(--pri)}
.seg{display:flex;background:#e6eaef;border-radius:10px;padding:3px;gap:3px}
.seg label{flex:1;text-align:center;padding:9px 2px;white-space:nowrap;border-radius:8px;font-size:14px;color:var(--ink)}
.seg input{display:none}
.seg label:has(input:checked){background:#fff;color:var(--pri);font-weight:600;box-shadow:0 1px 2px rgba(0,0,0,.1)}
.row2{display:grid;grid-template-columns:1fr 1fr;gap:8px}
.surf{margin-top:6px;font-size:14px}
.pin{width:22px;height:22px;border-radius:50% 50% 50% 0;background:var(--ora);border:3px solid #fff;transform:rotate(-45deg);box-shadow:0 2px 5px rgba(0,0,0,.4)}
.leaflet-popup-content{margin:10px 12px;font-size:13px}
.pop img{width:170px;height:110px;object-fit:cover;border-radius:6px;display:block;margin-bottom:6px}
.pop button{margin-top:6px;border:0;background:var(--pri);color:#fff;border-radius:6px;padding:6px 10px;font-size:13px}
.legend{background:#fff;padding:6px 9px;border-radius:8px;font-size:12px;box-shadow:0 1px 4px rgba(0,0,0,.2);line-height:1.7}
.legend i{display:inline-block;width:10px;height:10px;border-radius:50%;margin-right:5px}
#toast{position:fixed;left:50%;bottom:calc(env(safe-area-inset-bottom) + 90px);transform:translateX(-50%);background:#1d2733;color:#fff;padding:10px 16px;border-radius:20px;font-size:14px;opacity:0;transition:opacity .25s;pointer-events:none;z-index:2000}
#toast.show{opacity:.95}
#busy{position:fixed;inset:0;background:rgba(0,0,0,.35);display:none;align-items:center;justify-content:center;z-index:3000;color:#fff;font-size:16px}
#busy.show{display:flex}
</style>
</head>
<body>

<header>
  <img id="blason" alt="Blason de Pasly" style="height:38px;width:auto;flex:none">
  <h1>Voirie Pasly</h1>
  <span class="count" id="count"></span>
  <button class="hbtn" id="btnFilters">Filtres</button>
</header>

<div id="banner"><span id="bannerTxt"></span><button class="mini" onclick="doBackup()">Sauvegarder</button></div>

<div id="filters">
  <label>Rue<select id="fRue"></select></label>
  <label>Catégorie<select id="fCat"></select></label>
  <label>État<select id="fEtat"></select></label>
  <label>Gestionnaire<select id="fGest"></select></label>
  <button class="reset" onclick="resetFilters()">Effacer les filtres</button>
</div>

<main>
  <section class="view show" id="vList"></section>
  <section class="view" id="vMap"><div id="mainMap"></div></section>
  <section class="view" id="vExp"></section>
</main>

<button id="fab" onclick="openForm()" aria-label="Nouveau relevé">+</button>

<nav>
  <button class="on" data-tab="vList" onclick="showTab('vList')">
    <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M8 6h13M8 12h13M8 18h13M3 6h.01M3 12h.01M3 18h.01"/></svg>Relevés</button>
  <button data-tab="vMap" onclick="showTab('vMap')">
    <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M9 3 3 5v16l6-2 6 2 6-2V3l-6 2-6-2zM9 3v16M15 5v16"/></svg>Carte</button>
  <button data-tab="vExp" onclick="showTab('vExp')">
    <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M12 3v12M7 10l5 5 5-5M4 21h16"/></svg>Exports</button>
</nav>

<!-- Formulaire de relevé -->
<div id="modal">
  <div class="mh"><h2 id="mTitle">Nouveau relevé</h2><button class="hbtn" onclick="closeForm()">Fermer</button></div>
  <div class="mb">
    <div class="fg">
      <span class="fl">Photo</span>
      <div id="photoBox" onclick="document.getElementById('photoIn').click()"><div class="ph">📷<br>Toucher pour prendre la photo</div></div>
      <input type="file" id="photoIn" accept="image/*" capture="environment">
    </div>

    <div class="fg">
      <span class="fl">Localisation (déplacez le repère si besoin)</span>
      <div id="fMap"></div>
      <div class="posline"><span id="fPos">—</span><button class="mini" onclick="locate()">Ma position</button></div>
    </div>

    <div class="fg" style="display:grid;grid-template-columns:1fr 2.6fr;gap:8px">
      <div><label class="fl" for="fNumIn">Face au n°</label><input id="fNumIn" autocomplete="off" inputmode="text" placeholder="ex. 12 bis"></div>
      <div><label class="fl" for="fRueIn">Rue</label><input id="fRueIn" autocomplete="off"></div>
    </div>
    <div class="fg">
      <label for="fCommune">Commune</label><input id="fCommune" autocomplete="off">
    </div>

    <div class="fg">
      <label for="fCatIn">Catégorie</label>
      <select id="fCatIn" onchange="toggleAutres()"></select>
      <input id="fCatAutre" placeholder="Préciser la catégorie" style="margin-top:6px;display:none">
    </div>

    <div class="fg">
      <span class="fl">Gestionnaire de la voie</span>
      <div class="seg" id="fGestSeg"></div>
      <input id="fGestAutre" placeholder="Préciser (ex. intercommunalité, privé)" style="margin-top:6px;display:none">
    </div>

    <div class="fg">
      <span class="fl">Surface estimée (m²)</span>
      <div class="seg" id="fSurfSeg"></div>
      <input id="fSurfAutre" inputmode="decimal" placeholder="Surface en m² (ex. 3,5)" style="margin-top:6px;display:none">
    </div>

    <div class="fg">
      <label for="fCom">Commentaire</label>
      <textarea id="fCom" placeholder="Observations, contexte…"></textarea>
    </div>

    <div id="editBox" style="display:none">
      <div class="fg">
        <label for="fEtatIn">État</label>
        <select id="fEtatIn" onchange="etatChanged()"></select>
      </div>
      <div class="row2 fg">
        <div><label class="fl" for="fDProg">Date programmée</label><input type="date" id="fDProg"></div>
        <div><label class="fl" for="fDRep">Date de réparation</label><input type="date" id="fDRep"></div>
      </div>
      <p style="font-size:13px;color:var(--muted);margin:-4px 0 12px" id="fCreated"></p>
    </div>

    <button class="btn" onclick="saveForm()">Enregistrer</button>
    <button class="btn danger" id="btnDel" onclick="delForm()" style="display:none">Supprimer ce relevé</button>
  </div>
</div>

<input type="file" id="restoreIn" accept="application/json,.json" style="display:none">
<div id="toast"></div>
<div id="busy"><span id="busyTxt">Patientez…</span></div>

const $ = id => document.getElementById(id);
const esc = s => String(s ?? '').replace(/[&<>"']/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const pad = n => String(n).padStart(2,'0');
const today = () => { const d=new Date(); return `${d.getFullYear()}-${pad(d.getMonth()+1)}-${pad(d.getDate())}`; };
const fmtIso = iso => iso ? new Date(iso).toLocaleDateString('fr-FR') : '';
const fmtYmd = s => s ? s.split('-').reverse().join('/') : '';
const num = v => { const n = parseFloat(String(v ?? '').replace(',','.')); return isFinite(n) && n > 0 ? n : null; };
const fmtN = n => n == null ? '' : n.toLocaleString('fr-FR',{maximumFractionDigits:2});
const catLabel = r => r.categorie === 'Autre' && r.categorieAutre ? 'Autre : ' + r.categorieAutre : r.categorie;
const adresse = r => (r.numero ? 'face au n° '+r.numero+' ' : '') + (r.rue || (r.numero?'':'Rue non renseignée'));
const gestLabel = r => r.gestionnaire === 'Autre' && r.gestionnaireAutre ? r.gestionnaireAutre : r.gestionnaire;

function toast(t){ const e=$('toast'); e.textContent=t; e.classList.add('show'); clearTimeout(toast.t); toast.t=setTimeout(()=>e.classList.remove('show'),2200); }
function busy(on,t){ $('busyTxt').textContent=t||'Patientez…'; $('busy').classList.toggle('show',on); }

/* ===== Stockage (IndexedDB) ===== */
let dbp;
function idb(){
  if (dbp) return dbp;
  dbp = new Promise((res,rej)=>{
    const r = indexedDB.open('voirie-pasly',1);
    r.onupgradeneeded = () => { const d=r.result; d.createObjectStore('releves',{keyPath:'id'}); d.createObjectStore('meta'); };
    r.onsuccess = () => res(r.result);
    r.onerror = () => rej(r.error);
  });
  return dbp;
}
async function tx(store, mode, fn){
  const d = await idb();
  return new Promise((res,rej)=>{
    const t = d.transaction(store, mode);
    const out = fn(t.objectStore(store));
    t.oncomplete = () => res(out ? out.result : undefined);
    t.onerror = () => rej(t.error);
  });
}
const dbAll  = () => tx('releves','readonly', s=>s.getAll());
const dbPut  = o  => tx('releves','readwrite',s=>s.put(o));
const dbDel  = id => tx('releves','readwrite',s=>s.delete(id));
const metaGet = k => tx('meta','readonly', s=>s.get(k));
const metaSet = (k,v) => tx('meta','readwrite',s=>s.put(v,k));

/* ===== État ===== */
let releves = [];
const F = {rue:'',cat:'',etat:'',gest:''};

async function reload(){
  releves = (await dbAll()).sort((a,b)=>b.num-a.num);
  renderAll();
}
function filtered(){
  return releves.filter(r =>
    (!F.rue  || (r.rue||'(sans rue)') === F.rue) &&
    (!F.cat  || r.categorie === F.cat) &&
    (!F.etat || r.etat === F.etat) &&
    (!F.gest || r.gestionnaire === F.gest));
}
function nbFiltres(){ return Object.values(F).filter(Boolean).length; }
function filtresTexte(){
  const p=[];
  if(F.rue) p.push('Rue : '+F.rue);
  if(F.cat) p.push('Catégorie : '+F.cat);
  if(F.etat) p.push('État : '+ETATS[F.etat].l);
  if(F.gest) p.push('Gestionnaire : '+F.gest);
  return p.length ? p.join(' | ') : 'Aucun filtre (tous les relevés)';
}

/* ===== Filtres ===== */
function opts(sel, list, cur, all){
  sel.innerHTML = `<option value="">${all}</option>` + list.map(([v,l])=>`<option value="${esc(v)}"${v===cur?' selected':''}>${esc(l)}</option>`).join('');
}
function renderFilters(){
  const rues = [...new Set(releves.map(r=>r.rue||'(sans rue)'))].sort((a,b)=>a.localeCompare(b,'fr'));
  if (F.rue && !rues.includes(F.rue)) F.rue='';
  opts($('fRue'), rues.map(r=>[r,r]), F.rue, 'Toutes');
  opts($('fCat'), CATS.map(c=>[c,c]), F.cat, 'Toutes');
  opts($('fEtat'), Object.entries(ETATS).map(([k,v])=>[k,v.l]), F.etat, 'Tous');
  opts($('fGest'), GESTS.map(g=>[g,g]), F.gest, 'Tous');
  const n = nbFiltres();
  $('btnFilters').textContent = n ? `Filtres (${n})` : 'Filtres';
  $('btnFilters').classList.toggle('on', $('filters').classList.contains('show'));
}
[['fRue','rue'],['fCat','cat'],['fEtat','etat'],['fGest','gest']].forEach(([id,k])=>{
  $(id).addEventListener('change', e=>{ F[k]=e.target.value; renderAll(); });
});
$('btnFilters').onclick = () => { $('filters').classList.toggle('show'); renderFilters(); setTimeout(()=>mm&&mm.invalidateSize(),50); };
function resetFilters(){ F.rue=F.cat=F.etat=F.gest=''; renderAll(); }

/* ===== Rendu ===== */
function renderAll(){
  renderFilters();
  const l = filtered();
  $('count').textContent = nbFiltres() ? `${l.length}/${releves.length}` : `${releves.length} relevé${releves.length>1?'s':''}`;
  renderList(); renderExp();
  if ($('vMap').classList.contains('show')) renderMap();
  checkBackup();
}
function renderList(){
  const l = filtered();
  if (!releves.length){ $('vList').innerHTML = '<div class="empty">Aucun relevé pour l\'instant.<br>Touchez <b>+</b> pour signaler un problème.</div>'; return; }
  if (!l.length){ $('vList').innerHTML = '<div class="empty">Aucun relevé ne correspond aux filtres.</div>'; return; }
  $('vList').innerHTML = l.map(r=>`
    <div class="card" onclick="openForm('${r.id}')">
      <img src="${r.photo}" alt="" loading="lazy">
      <div class="ct">
        <div class="t1">N° ${r.num} · ${esc(catLabel(r))}</div>
        <div class="t2">${esc(adresse(r))}${r.commune?' – '+esc(r.commune):''}</div>
        <div class="t3">
          <span class="badge" style="background:${ETATS[r.etat].c}">${ETATS[r.etat].l}</span>
          ${r.surface?`<span class="chip">${fmtN(r.surface)} m²</span>`:''}
          <span class="chip">${esc(gestLabel(r))}</span>
          <span class="chip">${fmtIso(r.dateCreation)}</span>
        </div>
      </div>
    </div>`).join('');
}
function renderExp(){
  const l = filtered();
  const surf = l.reduce((s,r)=>s+(r.surface||0),0);
  const c = k => l.filter(r=>r.etat===k).length;
  $('vExp').innerHTML = `
    <div class="panel">
      <h2>Synthèse</h2>
      <p>${esc(filtresTexte())}</p>
      <div class="stats">
        <div class="stat"><b style="color:${ETATS.signale.c}">${c('signale')}</b><small>Signalés</small></div>
        <div class="stat"><b style="color:${ETATS.programme.c}">${c('programme')}</b><small>Programmés</small></div>
        <div class="stat"><b style="color:${ETATS.repare.c}">${c('repare')}</b><small>Réparés</small></div>
      </div>
      <p style="margin:10px 0 0">Surface totale relevée : <b style="color:var(--ink)">${fmtN(surf)||0} m²</b></p>
    </div>
    <div class="panel">
      <h2>Exports</h2>
      <p>Les exports portent sur les ${l.length} relevé${l.length>1?'s':''} affiché${l.length>1?'s':''} (filtres appliqués).</p>
      <button class="btn" onclick="exportXlsx()" ${l.length?'':'disabled'}>Export Excel</button>
      <button class="btn" onclick="exportPdf()" ${l.length?'':'disabled'}>Rapport PDF avec photos</button>
    </div>
    <div class="panel">
      <h2>Sauvegarde</h2>
      <p id="lastBk">Les relevés sont stockés sur ce téléphone uniquement. Sauvegardez régulièrement (fichier avec photos).</p>
      <button class="btn" onclick="doBackup()">Sauvegarder tous les relevés</button>
      <button class="btn sec" onclick="$('restoreIn').click()">Restaurer une sauvegarde</button>
    </div>`;
  metaGet('lastBackup').then(d=>{
    if ($('lastBk')) $('lastBk').innerHTML = `Relevés stockés sur ce téléphone uniquement. Dernière sauvegarde : <b style="color:var(--ink)">${d?new Date(d).toLocaleString('fr-FR',{dateStyle:'short',timeStyle:'short'}):'jamais'}</b>.`;
  });
}

/* ===== Onglets ===== */
function showTab(id){
  document.querySelectorAll('.view').forEach(v=>v.classList.toggle('show', v.id===id));
  document.querySelectorAll('nav button').forEach(b=>b.classList.toggle('on', b.dataset.tab===id));
  $('fab').style.display = id==='vExp' ? 'none' : '';
  if (id==='vMap') setTimeout(renderMap, 30);
}

/* ===== Fonds de carte ===== */
function baseLayers(){
  const ign = (layer, fmt) => L.tileLayer(
    `https://data.geopf.fr/wmts?SERVICE=WMTS&REQUEST=GetTile&VERSION=1.0.0&LAYER=${layer}&STYLE=normal&TILEMATRIXSET=PM&FORMAT=${fmt}&TILEMATRIX={z}&TILEROW={y}&TILECOL={x}`,
    {maxZoom:19, maxNativeZoom: layer.startsWith('ORTHO')?19:18, attribution:'© IGN'});
  return {
    'Plan IGN': ign('GEOGRAPHICALGRIDSYSTEMS.PLANIGNV2','image/png'),
    'Photo aérienne': ign('ORTHOIMAGERY.ORTHOPHOTOS','image/jpeg'),
    'OpenStreetMap': L.tileLayer('https://tile.openstreetmap.org/{z}/{x}/{y}.png',{maxZoom:19, attribution:'© OpenStreetMap'})
  };
}

/* ===== Carte générale ===== */
let mm=null, mmLayer=null;
function renderMap(){
  if (!mm){
    mm = L.map('mainMap',{zoomControl:true});
    const b = baseLayers(); b['Plan IGN'].addTo(mm);
    L.control.layers(b,null,{position:'topright'}).addTo(mm);
    mmLayer = L.layerGroup().addTo(mm);
    const lg = L.control({position:'bottomleft'});
    lg.onAdd = () => { const d=L.DomUtil.create('div','legend'); d.innerHTML=Object.values(ETATS).map(e=>`<i style="background:${e.c}"></i>${e.l}`).join('<br>'); return d; };
    lg.addTo(mm);
  }
  mm.invalidateSize();
  mmLayer.clearLayers();
  const l = filtered().filter(r=>r.lat!=null);
  l.forEach(r=>{
    L.circleMarker([r.lat,r.lng],{radius:10,color:'#fff',weight:2,fillColor:ETATS[r.etat].c,fillOpacity:.95})
     .bindPopup(`<div class="pop"><img src="${r.photo}"><b>N° ${r.num} · ${esc(catLabel(r))}</b><br>${esc(adresse(r))}<br>${ETATS[r.etat].l}${r.surface?' · '+fmtN(r.surface)+' m²':''}<br><button onclick="openForm('${r.id}')">Ouvrir</button></div>`)
     .addTo(mmLayer);
  });
  if (l.length) mm.fitBounds(L.latLngBounds(l.map(r=>[r.lat,r.lng])),{padding:[40,40],maxZoom:17});
  else mm.setView(PASLY,15);
}

/* ===== Formulaire ===== */
let fm=null, fmMarker=null, cur=null, geoSeq=0;
const pinIcon = () => L.divIcon({className:'',html:'<div class="pin"></div>',iconSize:[22,22],iconAnchor:[11,22]});

(function initFormStatics(){
  $('fCatIn').innerHTML = CATS.map(c=>`<option>${c}</option>`).join('');
  $('fEtatIn').innerHTML = Object.entries(ETATS).map(([k,v])=>`<option value="${k}">${v.l}</option>`).join('');
  $('fSurfSeg').innerHTML = SURFS.map(v=>`<label><input type="radio" name="surf" value="${v}" onchange="toggleAutres()">${fmtN(v)}</label>`).join('')
    + `<label><input type="radio" name="surf" value="autre" onchange="toggleAutres()">Autre</label>`;
  $('fGestSeg').innerHTML = GESTS.map(g=>`<label><input type="radio" name="gest" value="${g}" onchange="toggleAutres()">${g}</label>`).join('');
})();

function toggleAutres(){
  $('fCatAutre').style.display = $('fCatIn').value==='Autre' ? '' : 'none';
  const g = document.querySelector('input[name=gest]:checked');
  $('fGestAutre').style.display = g && g.value==='Autre' ? '' : 'none';
  const sf = document.querySelector('input[name=surf]:checked');
  $('fSurfAutre').style.display = sf && sf.value==='autre' ? '' : 'none';
}
function setPhoto(src){
  $('photoBox').innerHTML = src ? `<img src="${src}" alt="">` : '<div class="ph">📷<br>Toucher pour prendre la photo</div>';
}

function openForm(id){
  if (mm) mm.closePopup();
  const r = id ? releves.find(x=>x.id===id) : null;
  cur = r ? {...r} : {etat:'signale', categorie:'Chaussée', gestionnaire:'Communale', lat:null, lng:null, photo:null};
  $('mTitle').textContent = r ? `Relevé N° ${r.num}` : 'Nouveau relevé';
  setPhoto(cur.photo);
  $('fNumIn').value = cur.numero||'';
  $('fRueIn').value = cur.rue||'';
  $('fCommune').value = cur.commune||'';
  $('fCatIn').value = cur.categorie;
  $('fCatAutre').value = cur.categorieAutre||'';
  document.querySelectorAll('input[name=gest]').forEach(i=>i.checked = i.value===cur.gestionnaire);
  $('fGestAutre').value = cur.gestionnaireAutre||'';
  const preset = cur.surface!=null && SURFS.includes(cur.surface);
  document.querySelectorAll('input[name=surf]').forEach(i=>i.checked =
    preset ? Number(i.value)===cur.surface : (cur.surface!=null && i.value==='autre'));
  $('fSurfAutre').value = cur.surface!=null && !preset ? String(cur.surface).replace('.',',') : '';
  $('fCom').value = cur.commentaire||'';
  $('fEtatIn').value = cur.etat;
  $('fDProg').value = cur.dateProgramme||'';
  $('fDRep').value = cur.dateReparation||'';
  $('fCreated').textContent = r ? 'Relevé créé le ' + new Date(r.dateCreation).toLocaleString('fr-FR',{dateStyle:'long',timeStyle:'short'}) : '';
  $('editBox').style.display = r ? '' : 'none';
  $('btnDel').style.display = r ? '' : 'none';
  toggleAutres();
  $('modal').classList.add('open');
  $('modal').querySelector('.mb').scrollTop = 0;

  setTimeout(()=>{
    if (!fm){
      fm = L.map('fMap');
      const b = baseLayers(); b['Plan IGN'].addTo(fm);
      L.control.layers(b,null,{position:'topright'}).addTo(fm);
      fm.on('click', e=>setPos(e.latlng.lat, e.latlng.lng, true));
    }
    fm.invalidateSize();
    if (fmMarker){ fm.removeLayer(fmMarker); fmMarker=null; }
    if (cur.lat!=null){ setPos(cur.lat, cur.lng, false); fm.setView([cur.lat,cur.lng],18); }
    else { fm.setView(PASLY,15); $('fPos').textContent='—'; locate(); }
  }, 50);
}
function closeForm(){ $('modal').classList.remove('open'); cur=null; }

function setPos(lat, lng, geocode){
  cur.lat = lat; cur.lng = lng;
  if (!fmMarker){
    fmMarker = L.marker([lat,lng],{draggable:true, icon:pinIcon()}).addTo(fm);
    fmMarker.on('dragend', ()=>{ const p=fmMarker.getLatLng(); setPos(p.lat,p.lng,true); });
  } else fmMarker.setLatLng([lat,lng]);
  $('fPos').textContent = `${lat.toFixed(6)}, ${lng.toFixed(6)}`;
  if (geocode) reverse(lat,lng);
}
function locate(){
  if (!navigator.geolocation){ $('fPos').textContent='Géolocalisation indisponible : placez le repère sur la carte.'; return; }
  $('fPos').textContent = 'Localisation en cours…';
  navigator.geolocation.getCurrentPosition(p=>{
    if (!cur) return;
    setPos(p.coords.latitude, p.coords.longitude, true);
    fm.setView([p.coords.latitude, p.coords.longitude], 18);
    $('fPos').textContent += ` (précision ±${Math.round(p.coords.accuracy)} m)`;
  }, err=>{
    $('fPos').textContent = err.code===1 ? 'Localisation refusée : autorisez-la ou placez le repère.' : 'Position introuvable : placez le repère sur la carte.';
  }, {enableHighAccuracy:true, timeout:20000, maximumAge:0});
}
async function reverse(lat,lng){
  const seq = ++geoSeq;
  const urls = [
    `https://data.geopf.fr/geocodage/reverse?lon=${lng}&lat=${lat}&index=address&limit=1`,
    `https://api-adresse.data.gouv.fr/reverse/?lon=${lng}&lat=${lat}&limit=1`
  ];
  for (const u of urls){
    try{
      const r = await fetch(u); if (!r.ok) continue;
      const j = await r.json();
      const p = j.features && j.features[0] && j.features[0].properties;
      if (p){
        if (seq!==geoSeq || !cur) return;
        $('fNumIn').value = p.housenumber || '';
        $('fRueIn').value = p.street || p.name || '';
        $('fCommune').value = p.city || '';
        return;
      }
    }catch(e){}
  }
}

$('photoIn').addEventListener('change', async e=>{
  const f = e.target.files[0]; e.target.value='';
  if (!f || !cur) return;
  busy(true,'Traitement de la photo…');
  try{ cur.photo = await compress(f); setPhoto(cur.photo); }
  catch(err){ alert('Impossible de lire la photo.'); }
  busy(false);
});
function compress(file, max=1600, q=0.75){
  return new Promise((res,rej)=>{
    const url = URL.createObjectURL(file), img = new Image();
    img.onload = ()=>{
      const s = Math.min(1, max/Math.max(img.naturalWidth, img.naturalHeight));
      const c = document.createElement('canvas');
      c.width = Math.round(img.naturalWidth*s); c.height = Math.round(img.naturalHeight*s);
      c.getContext('2d').drawImage(img,0,0,c.width,c.height);
      URL.revokeObjectURL(url);
      res(c.toDataURL('image/jpeg', q));
    };
    img.onerror = ()=>{ URL.revokeObjectURL(url); rej(); };
    img.src = url;
  });
}
function etatChanged(){
  const e = $('fEtatIn').value;
  if (e!=='signale' && !$('fDProg').value) $('fDProg').value = today();
  if (e==='repare' && !$('fDRep').value) $('fDRep').value = today();
}

async function saveForm(){
  if (!cur.photo){ alert('Prenez une photo du problème.'); return; }
  if (cur.lat==null){ alert('Position manquante : touchez « Ma position » ou placez le repère sur la carte.'); return; }
  const g = document.querySelector('input[name=gest]:checked');
  if (!g){ alert('Indiquez le gestionnaire de la voie.'); return; }
  const sf = document.querySelector('input[name=surf]:checked');
  const surface = !sf ? null : sf.value==='autre' ? num($('fSurfAutre').value) : Number(sf.value);
  Object.assign(cur, {
    numero: $('fNumIn').value.trim(),
    rue: $('fRueIn').value.trim(),
    commune: $('fCommune').value.trim(),
    categorie: $('fCatIn').value,
    categorieAutre: $('fCatIn').value==='Autre' ? $('fCatAutre').value.trim() : '',
    gestionnaire: g.value,
    gestionnaireAutre: g.value==='Autre' ? $('fGestAutre').value.trim() : '',
    surface: surface!=null ? Math.round(surface*100)/100 : null,
    commentaire: $('fCom').value.trim(),
    dateModification: new Date().toISOString()
  });
  if (cur.id){
    cur.etat = $('fEtatIn').value;
    cur.dateProgramme = $('fDProg').value || '';
    cur.dateReparation = $('fDRep').value || '';
  } else {
    cur.id = Date.now().toString(36) + Math.random().toString(36).slice(2,7);
    cur.num = releves.reduce((m,r)=>Math.max(m,r.num||0),0) + 1;
    cur.dateCreation = new Date().toISOString();
    cur.etat = 'signale'; cur.dateProgramme=''; cur.dateReparation='';
  }
  try{ await dbPut(cur); }
  catch(e){ alert('Enregistrement impossible (stockage plein ?).'); return; }
  const n = cur.num;
  closeForm(); await reload();
  toast(`Relevé N° ${n} enregistré`);
}
async function delForm(){
  if (!confirm(`Supprimer définitivement le relevé N° ${cur.num} ?`)) return;
  await dbDel(cur.id); closeForm(); await reload(); toast('Relevé supprimé');
}

/* ===== Téléchargement ===== */
function download(blob, name){
  const a = document.createElement('a');
  a.href = URL.createObjectURL(blob); a.download = name;
  document.body.appendChild(a); a.click(); a.remove();
  setTimeout(()=>URL.revokeObjectURL(a.href), 4000);
}

/* ===== Export Excel ===== */
function exportXlsx(){
  const l = filtered().slice().sort((a,b)=>a.num-b.num);
  const rows = l.map(r=>({
    'N°': r.num,
    'Date relevé': fmtIso(r.dateCreation),
    'Catégorie': catLabel(r),
    'Face au n°': r.numero||'',
    'Rue': r.rue||'',
    'Commune': r.commune||'',
    'Gestionnaire': gestLabel(r),
    'Surface (m²)': r.surface ?? '',
    'État': ETATS[r.etat].l,
    'Date programmée': fmtYmd(r.dateProgramme),
    'Date réparation': fmtYmd(r.dateReparation),
    'Commentaire': r.commentaire||'',
    'Latitude': r.lat, 'Longitude': r.lng,
    'Lien carte': `https://www.google.com/maps?q=${r.lat},${r.lng}`
  }));
  const ws = XLSX.utils.json_to_sheet(rows);
  ws['!cols'] = [6,12,22,10,28,14,16,12,11,15,15,40,11,11,40].map(w=>({wch:w}));
  ws['!autofilter'] = {ref: ws['!ref']};

  const byRue = {};
  l.forEach(r=>{
    const k = (r.rue||'(sans rue)') + '|' + gestLabel(r);
    const o = byRue[k] ||= {'Rue':r.rue||'(sans rue)','Gestionnaire':gestLabel(r),'Nb relevés':0,'Surface totale (m²)':0,'Signalés':0,'Programmés':0,'Réparés':0};
    o['Nb relevés']++; o['Surface totale (m²)'] += r.surface||0;
    o[{signale:'Signalés',programme:'Programmés',repare:'Réparés'}[r.etat]]++;
  });
  const syn = Object.values(byRue).sort((a,b)=>a.Rue.localeCompare(b.Rue,'fr'));
  syn.forEach(o=>o['Surface totale (m²)']=Math.round(o['Surface totale (m²)']*100)/100);
  syn.push({'Rue':'TOTAL','Gestionnaire':'',
    'Nb relevés': l.length,
    'Surface totale (m²)': Math.round(l.reduce((s,r)=>s+(r.surface||0),0)*100)/100,
    'Signalés': l.filter(r=>r.etat==='signale').length,
    'Programmés': l.filter(r=>r.etat==='programme').length,
    'Réparés': l.filter(r=>r.etat==='repare').length});
  const ws2 = XLSX.utils.json_to_sheet(syn);
  ws2['!cols'] = [30,16,11,18,10,11,9].map(w=>({wch:w}));

  const wb = XLSX.utils.book_new();
  XLSX.utils.book_append_sheet(wb, ws, 'Relevés');
  XLSX.utils.book_append_sheet(wb, ws2, 'Synthèse par rue');
  const out = XLSX.write(wb,{bookType:'xlsx',type:'array'});
  download(new Blob([out],{type:'application/vnd.openxmlformats-officedocument.spreadsheetml.sheet'}), `recensement-voirie-pasly-${today()}.xlsx`);
}

/* ===== Rapport PDF ===== */
const imgSize = src => new Promise(res=>{ const i=new Image(); i.onload=()=>res([i.naturalWidth,i.naturalHeight]); i.onerror=()=>res([4,3]); i.src=src; });
const hex = h => [parseInt(h.slice(1,3),16),parseInt(h.slice(3,5),16),parseInt(h.slice(5,7),16)];

async function exportPdf(){
  busy(true,'Création du rapport…');
  try{
    const l = filtered().slice().sort((a,b)=>a.num-b.num);
    const { jsPDF } = window.jspdf;
    const doc = new jsPDF({unit:'mm', format:'a4'});
    const W=210, M=15;
    // En-tête
    doc.setFillColor(31,78,121); doc.rect(0,0,W,28,'F');
    doc.setTextColor(255); doc.setFont('helvetica','bold'); doc.setFontSize(16);
    try{ doc.addImage(BLASON,'PNG',M,3.5,15.8,21); }catch(e){}
    doc.text('Commune de Pasly', M+21, 12);
    doc.setFontSize(12); doc.setFont('helvetica','normal');
    doc.text('Recensement des désordres de voirie', M+21, 20);
    doc.setTextColor(30); doc.setFontSize(10);
    let y = 37;
    doc.text(`Édité le ${new Date().toLocaleDateString('fr-FR')}`, M, y); y+=6;
    doc.splitTextToSize(filtresTexte(), W-2*M).forEach(t=>{ doc.text(t,M,y); y+=5; });
    const surf = Math.round(l.reduce((s,r)=>s+(r.surface||0),0)*100)/100;
    const c = k => l.filter(r=>r.etat===k).length;
    y+=1;
    doc.setFont('helvetica','bold');
    doc.text(`${l.length} relevé(s) – Surface totale : ${fmtN(surf)||0} m²`, M, y); y+=6;
    doc.setFont('helvetica','normal');
    doc.text(`Signalés : ${c('signale')}   Programmés : ${c('programme')}   Réparés : ${c('repare')}`, M, y); y+=5;
    doc.setDrawColor(200); doc.line(M,y,W-M,y); y+=6;

    const BH = 78;
    for (const r of l){
      if (y + BH > 285){ doc.addPage(); y = 15; }
      const [iw,ih] = await imgSize(r.photo);
      const maxW=75, maxH=BH-8; let w=maxW, h=w*ih/iw; if (h>maxH){ h=maxH; w=h*iw/ih; }
      try{ doc.addImage(r.photo,'JPEG',M,y,w,h); }catch(e){}
      const x = M+maxW+6, tw = W-M-x; let ty = y+4;
      doc.setFont('helvetica','bold'); doc.setFontSize(12); doc.setTextColor(30);
      doc.text(`N° ${r.num} – ${catLabel(r)}`, x, ty); ty+=6;
      const [cr,cg,cb] = hex(ETATS[r.etat].c);
      doc.setFillColor(cr,cg,cb); doc.roundedRect(x,ty-3.6,24,5,1.5,1.5,'F');
      doc.setTextColor(255); doc.setFontSize(8.5); doc.text(ETATS[r.etat].l, x+12, ty, {align:'center'});
      doc.setTextColor(30); doc.setFont('helvetica','normal'); doc.setFontSize(9.5); ty+=6;
      const lines = [
        `Lieu : ${adresse(r)}${r.commune?' ('+r.commune+')':''}`,
        `Gestionnaire : ${gestLabel(r)}`,
        `Surface estimée : ${r.surface?fmtN(r.surface)+' m²':'non renseignée'}`,
        `Relevé le : ${fmtIso(r.dateCreation)}`,
        r.dateProgramme ? `Programmé le : ${fmtYmd(r.dateProgramme)}` : null,
        r.dateReparation ? `Réparé le : ${fmtYmd(r.dateReparation)}` : null,
        `GPS : ${r.lat.toFixed(6)}, ${r.lng.toFixed(6)}`
      ].filter(Boolean);
      lines.forEach(t=>{ doc.splitTextToSize(t,tw).forEach(s=>{ doc.text(s,x,ty); ty+=4.6; }); });
      if (r.commentaire){
        doc.setFont('helvetica','italic');
        doc.splitTextToSize(r.commentaire,tw).slice(0,4).forEach(s=>{ doc.text(s,x,ty); ty+=4.4; });
        doc.setFont('helvetica','normal');
      }
      y += BH; doc.setDrawColor(225); doc.line(M,y-3,W-M,y-3);
    }
    const n = doc.getNumberOfPages();
    for (let i=1;i<=n;i++){ doc.setPage(i); doc.setFontSize(8); doc.setTextColor(130); doc.text(`Page ${i}/${n}`, W-M, 292, {align:'right'}); }
    download(doc.output('blob'), `rapport-voirie-pasly-${today()}.pdf`);
  }catch(e){ alert('Erreur lors de la création du PDF.'); console.error(e); }
  busy(false);
}

/* ===== Sauvegarde / restauration ===== */
async function doBackup(){
  const all = await dbAll();
  if (!all.length){ toast('Aucun relevé à sauvegarder'); return; }
  const data = {app:'voirie-pasly', version:1, exportedAt:new Date().toISOString(), releves:all};
  download(new Blob([JSON.stringify(data)],{type:'application/json'}), `sauvegarde-voirie-pasly-${today()}.json`);
  await metaSet('lastBackup', Date.now());
  renderAll(); toast('Sauvegarde téléchargée');
}
$('restoreIn').addEventListener('change', async e=>{
  const f = e.target.files[0]; e.target.value='';
  if (!f) return;
  try{
    const data = JSON.parse(await f.text());
    if (data.app!=='voirie-pasly' || !Array.isArray(data.releves)) throw 0;
    if (!confirm(`Restaurer ${data.releves.length} relevé(s) ?\nLes relevés existants portant le même identifiant seront remplacés, les autres conservés.`)) return;
    busy(true,'Restauration…');
    for (const r of data.releves) if (r.id && r.photo) await dbPut(r);
    busy(false); await reload(); toast('Restauration terminée');
  }catch(err){ busy(false); alert('Fichier de sauvegarde invalide.'); }
});
async function checkBackup(){
  const last = await metaGet('lastBackup');
  const jours = last ? Math.floor((Date.now()-last)/86400000) : null;
  const show = releves.length && (last==null || jours >= RAPPEL_JOURS);
  $('banner').classList.toggle('show', !!show);
  if (show) $('bannerTxt').textContent = last==null ? 'Aucune sauvegarde effectuée.' : `Dernière sauvegarde il y a ${jours} jours.`;
}


/* ===== Démarrage ===== */
if (navigator.storage && navigator.storage.persist) navigator.storage.persist().catch(()=>{});
reload();
